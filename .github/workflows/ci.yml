name: ci

on:
  push:
    branches: [main]
    # 只改文档不会影响编译或类型检查。
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# 同一分支的新推送取代仍在跑的旧任务。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/pack.mjs
      # hub 安装时会校验 gzip 尾部，写不完整的包会被拒绝。
      - run: gzip -t theme.tar.gz
      # 面板的「一键更新」按 release 的 tag 与已装版本比较，两者不一致就会反复重装。
      - run: |
          V=$(node -p 'require("./theme.json").version')
          [ "$(node -p 'require("./package.json").version')" = "$V" ] \
            || { echo "::error file=package.json::version 与 theme.json 的 $V 不一致"; exit 1; }
