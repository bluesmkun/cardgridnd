name: release

# 打 v* tag 时构建并发布 theme.tar.gz。面板的「从 GitHub 安装」和「从 GitHub 更新」
# 只读仓库最新正式 release 里名为 theme.tar.gz 的文件，所以这个附件就是分发形式。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 不把凭据留在 .git/config 里：npm 安装脚本和构建都在这个 job 中运行，
      # 只有下面的发布步骤才拿到 token。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tag 与 theme.json 的 version 必须一致：hub 只要发现两者不同，就会一直
      # 把它当成可更新的新版本，每次打开面板都提示更新。这里先挡住。
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(node -p 'require("./theme.json").version')
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, theme.json $V"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pack.mjs 自己写 tar，避免 GNU tar 带进扩展属性条目——hub 只接受普通文件和目录。
      - run: node scripts/pack.mjs
      - run: gzip -t theme.tar.gz
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      # 手动触发时只构建打包、不发布，这样不必真的切一个 release 就能验证整条路径。
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
