<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark, at the size a tab shows it: the same dark square that
       stands beside the title, with a smaller white square inset so the shape
       still reads as a mark rather than as a solid block. -->
  <rect width="32" height="32" rx="7" fill="#16181d" />
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#ffffff" />
</svg>
